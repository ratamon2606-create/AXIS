name: CI

on:
  push:
    branches:
      - main
      - "iter4/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: source

    # Build-time placeholders only. CI never connects to production services.
    env:
      DATABASE_URL: postgresql://hub:hub@127.0.0.1:5432/hub?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      AUTH_TRUST_HOST: "true"
      ALLOWED_EMAIL_DOMAINS: ku.th
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: hub-files
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate pinned Next.js and lockfile integrity
        run: npm run security:gate

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Comment policy
        run: npm run quality:comments

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Production build
        run: npm run build
