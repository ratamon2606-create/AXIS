name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install
        working-directory: source
        run: npm ci

      - name: Generate Prisma client
        working-directory: source
        run: npx prisma generate

      - name: Type check
        working-directory: source
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: source
        run: npx vitest run
